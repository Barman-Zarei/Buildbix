# BUILDBIX CI template: flutter-android (v1)
# STATUS: UNVERIFIED default
# >>> REPLACE with a workflow you have run successfully on a real Flutter project (keep the double-brace placeholders you want filled).
name: BUILDBIX Flutter APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "{{java_version}}"
      - uses: subosito/flutter-action@v2
        with:
          channel: {{flutter_channel}}
      - run: flutter pub get
        working-directory: {{workdir}}
      - run: flutter build apk --release
        working-directory: {{workdir}}
      - uses: actions/upload-artifact@v4
        with:
          name: buildbix-artifacts
          path: {{workdir}}/build/app/outputs/flutter-apk/app-release.apk
