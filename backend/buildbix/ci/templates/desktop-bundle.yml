# BUILDBIX CI template: desktop-bundle (v1)  -- Windows + Linux + macOS via PyInstaller
# STATUS: UNVERIFIED default
# >>> REPLACE with a workflow you have run successfully on a real Python desktop project (keep the double-brace placeholders you want filled).
name: BUILDBIX Desktop bundle
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "{{python_version}}"
      - run: python -m pip install pyinstaller
      - run: python -m pip install -r requirements.txt
        if: hashFiles('requirements.txt') != ''
      - run: pyinstaller --noconfirm --onefile --name {{app_name}} {{entry_point}}
      - uses: actions/upload-artifact@v4
        with:
          name: buildbix-artifacts-${{ matrix.os }}
          path: dist/*
